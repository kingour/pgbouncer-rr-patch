[pgbouncer]
listen_port = 5439
listen_addr = *
; Optional PROXY v1 headers; enable only behind trusted proxies.
;proxy_protocol = 0
auth_type = md5
auth_file = users.txt
logfile = /tmp/pgbouncer.log
pidfile = /tmp/pgbouncer.pid
admin_users = master
ignore_startup_parameters = extra_float_digits,TimeZone
pkt_buf = 32768
pool_mode = statement
routing_rules_py_module_file = ./routing_rules.py
rewrite_query_py_module_file = ./rewrite_query.py
; Buffer overflow policy; Python callback errors always disconnect.
rewrite_query_disconnect_on_failure = true
; Original SQL logging requires query rewriting to be enabled.
;log_audit = false

[databases]
dev = host=<hostdefault> port=5439 dbname=dev
dev.1 = host=<host1> port=5439 dbname=dev
dev.2 = host=<host2> port=5439 dbname=dev



